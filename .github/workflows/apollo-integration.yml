name: Apollo plugin tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  # Detect upstream Apollo changes even when this plugin has no new commits.
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Node 24 still includes Corepack; enable its Yarn shims before using Yarn.
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check TypeScript
        run: yarn typecheck

      - name: Run unit tests with source coverage
        id: coverage
        run: yarn test:coverage

      # Preserve reports for diagnosis even when a test fails.
      - name: Upload coverage reports
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            coverage/summary.txt
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Build plugin
        run: yarn build

      - name: Check development and production bundle loading
        run: yarn test:bundle

  apollo-integration:
    name: Apollo custom-auth contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: unit-tests

    # Skip integration only for direct pushes to dev.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Checkout Apollo3
        uses: actions/checkout@v7
        with:
          repository: GMOD/Apollo3
          ref: main
          path: .apollo3
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test Apollo authentication contract
        env:
          APOLLO3_PATH: ${{ github.workspace }}/.apollo3
        run: yarn test:apollo
