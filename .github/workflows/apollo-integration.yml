name: Apollo plugin tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test

      - name: Build plugin
        run: yarn build

  apollo-integration:
    name: Apollo custom-auth contract
    runs-on: ubuntu-latest
    needs: unit-tests

    # Skip integration only for direct pushes to dev.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout Apollo3
        uses: actions/checkout@v4
        with:
          repository: GMOD/Apollo3
          ref: main
          path: .apollo3
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test Apollo authentication contract
        env:
          APOLLO3_PATH: ${{ github.workspace }}/.apollo3
        run: node --test integration/apollo-contract.test.cjs
